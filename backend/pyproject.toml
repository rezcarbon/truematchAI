[project]
name = "truematch-backend"
version = "0.1.0"
description = "TrueMatch — AI-embodied ATS / hiring-assessment platform backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "celery>=5.4",
    "anthropic>=0.34",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
    "aioboto3>=1.14",  # Async AWS SDK (S3 health checks)
    "google-cloud-aiplatform>=1.0",  # Google Cloud Vertex AI integration
    "pypdf>=4.2",
    "python-docx>=1.1",
    # Synchronous Postgres driver used by the Celery worker (psycopg v3).
    "psycopg[binary]>=3.1",
    # HTTP client for the Singpass OIDC token exchange.
    "httpx>=0.27",
    # Field-level PII encryption (AES-256-GCM) + blind indexes.
    "cryptography>=42.0",
    # Observability (optional at runtime; lazily initialised).
    "sentry-sdk[fastapi]>=2.0",
    "prometheus-client>=0.20",
    # Static embeddings for the semantic matcher (Pillar 1) — no torch required.
    "model2vec>=0.3",
    # Billing & payments (Stripe-hosted Checkout + webhooks). Gated on keys.
    "stripe>=9,<13",
    # Email ingestion for autonomous CV/JD submissions via inbox monitoring.
    "aioimaplib>=1.1",
    "aiosmtplib>=5.0",
    # Async file IO + filesystem watching used by the file-ingestion worker
    # (both were imported but undeclared).
    "aiofiles>=23.0",
    "watchdog>=4.0",
    # PDF report rendering (candidate + recruiter reports).
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    # Spins an ephemeral Postgres for the DB-backed pipeline test (needs Docker).
    "testcontainers[postgres]>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit, pinned selection. Ruff's implicit default set has grown across
# releases; without a `select` here a routine ruff upgrade silently turns the
# lint gate red on thousands of stylistic findings. This set is scoped to
# correctness and import hygiene:
#   E4/E7/E9  import placement, statement-level mistakes, syntax errors
#   F         pyflakes: undefined names, unused imports, f-string bugs
#   W         whitespace
#   I         import sorting (isort)
# Stylistic/opinion rules (UP annotation rewrites, BLE001 blind-except,
# B008 FastAPI Depends-in-defaults, datetime tz nits, …) are intentionally
# NOT selected — they are tracked separately, not build-blocking.
select = ["E4", "E7", "E9", "F", "W", "I"]
ignore = [
    # SQLAlchemy filter expressions require `== None` / `== True` to build the
    # correct SQL (`IS NULL` / `= true`); `is None` / truthiness would change
    # the generated query. This codebase uses that idiom throughout.
    "E711",
    "E712",
]

[tool.ruff.lint.per-file-ignores]
# conftest sets environment variables before importing the app on purpose.
"tests/conftest.py" = ["E402"]
# Module is skipped at collection (job_search feature disabled); it still
# references the not-yet-existing JobSearch model in dead helper code.
"tests/test_phase1_endpoints.py" = ["F821"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# Only the test suite is collected. `scripts/` holds standalone operational
# scripts (not pytest modules) and must not be import-collected.
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
