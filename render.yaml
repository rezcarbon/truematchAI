services:
  # PostgreSQL Database
  - type: pserv
    name: truematch-db-staging
    plan: free
    ipAllowList: []
    previewPlan: free
    databaseName: truematch
    user: truematch_user
    region: oregon

  # Redis Cache
  - type: redis
    name: truematch-redis-staging
    plan: free
    ipAllowList: []
    previewPlan: free
    region: oregon

  # FastAPI Backend
  - type: web
    name: truematch-api-staging
    env: python
    plan: starter
    previewPlan: starter
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    region: oregon
    port: 8000
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: truematch-db-staging
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: truematch-redis-staging
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENCRYPTION_INDEX_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://truematch-web-staging.onrender.com,http://localhost:3000"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      - key: AWS_REGION
        value: ap-southeast-1
      - key: S3_BUCKET
        value: truematch-staging-uploads
      - key: MAX_UPLOAD_BYTES
        value: "5000000"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: METRICS_ENABLED
        value: "true"

  # Next.js Frontend
  - type: web
    name: truematch-web-staging
    env: node
    plan: starter
    previewPlan: starter
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    rootDir: web
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://truematch-api-staging.onrender.com
      - key: NEXT_PUBLIC_ENVIRONMENT
        value: staging
      - key: NEXT_PUBLIC_APP_URL
        value: https://truematch-web-staging.onrender.com
      - key: NODE_ENV
        value: production

databases:
  - name: truematch-db-staging
    databaseName: truematch
    user: truematch_user
    plan: free
    region: oregon

env: staging
