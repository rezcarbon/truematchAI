apiVersion: v1
kind: Namespace
metadata:
  name: truematch

---
apiVersion: v1
kind: Secret
metadata:
  name: admin-dashboard-secrets
  namespace: truematch
type: Opaque
stringData:
  NEXTAUTH_SECRET: "your-production-secret-here"
  BACKEND_API_TOKEN: "your-production-api-token-here"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-dashboard-config
  namespace: truematch
data:
  NEXTAUTH_URL: "https://admin.truematch.ai"
  BACKEND_API_URL: "https://api.truematch.ai/v1"
  NEXT_PUBLIC_API_BASE_URL: "/api"
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-dashboard
  namespace: truematch
  labels:
    app: admin-dashboard
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: admin-dashboard
  template:
    metadata:
      labels:
        app: admin-dashboard
        version: v1.0.0
    spec:
      serviceAccountName: admin-dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: admin-dashboard
        image: truematch/admin-dashboard:latest
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 3000
          protocol: TCP

        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: admin-dashboard-config

        # Secrets
        env:
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: admin-dashboard-secrets
              key: NEXTAUTH_SECRET
        - name: BACKEND_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: admin-dashboard-secrets
              key: BACKEND_API_TOKEN

        # Health checks
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # Resource requests and limits
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi

        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

        # Logging
        volumeMounts:
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: tmp
        emptyDir: {}

      # Pod disruption budget
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - admin-dashboard
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: admin-dashboard
  namespace: truematch
  labels:
    app: admin-dashboard
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: admin-dashboard

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: admin-dashboard-hpa
  namespace: truematch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: admin-dashboard
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: admin-dashboard-pdb
  namespace: truematch
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: admin-dashboard

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-dashboard
  namespace: truematch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin-dashboard
  namespace: truematch
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-dashboard
  namespace: truematch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: admin-dashboard
subjects:
- kind: ServiceAccount
  name: admin-dashboard
  namespace: truematch
